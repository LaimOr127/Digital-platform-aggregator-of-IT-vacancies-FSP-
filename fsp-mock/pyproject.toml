[project]
name = "itmatch-fsp-mock"
version = "0.2.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"app/data.py" = ["E501"]  # таблица демо-данных читается лучше в одну строку на запись

[tool.pytest.ini_options]
testpaths = ["tests"]
