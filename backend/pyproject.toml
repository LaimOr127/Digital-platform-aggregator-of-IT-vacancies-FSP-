[project]
name = "itmatch-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках/комментариях

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311", "S603"]  # тестовые пароли, зёрна, команды
"migrations/*" = ["S608", "E501"]  # статический SQL политик RLS, без пользовательского ввода
# генерация вариантов заданий, а не криптография: зерно попытки берётся из secrets;
# длинные строки — тексты заданий, переносить их внутри фразы хуже для чтения
"app/services/assessment/bank_*.py" = ["S311", "E501"]
"app/services/assessment/{engine,service,preview}.py" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async исполняет код в greenlet

[tool.coverage.report]
fail_under = 80
skip_empty = true
