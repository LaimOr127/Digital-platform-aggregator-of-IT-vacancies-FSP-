services:
  api:
    build: { context: ../backend, target: runtime }
    image: itmatch/api:local
    extends: { file: common.yml, service: python-app }
    networks: [edge, internal]
    # ИИ-разбор резюме (необязательно): без ключа работает алгоритм на правилах
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
