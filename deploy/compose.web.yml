services:
  web:
    build: { context: ../frontend, target: runtime }
    image: itmatch/web:local
    extends: { file: common.yml, service: hardened }
    user: "10001:10001"
    # бинарник caddy в образе помечен file capability cap_net_bind_service:
    # без неё в bounding set ядро не даёт его запустить (порт 8080 при этом непривилегированный)
    cap_add: [NET_BIND_SERVICE]
    tmpfs:
      - /data:uid=10001,gid=10001,size=8m
      - /config:uid=10001,gid=10001,size=8m
    networks: [edge]
