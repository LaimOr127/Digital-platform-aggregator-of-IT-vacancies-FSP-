# Сервер: автоперезапуск, лимиты ресурсов, 80/443 наружу, egress для реального API ФСП.
# APP_ENV=prod задаётся здесь явно: prod-режим не зависит от значения в .env.
# Демо-коды ФСП в prod выключены; для демо-стенда с моком — явно FSP_DEMO_CODES_PROD=true.
x-limits: &limits
  restart: unless-stopped
x-prod-env: &prod-env
  APP_ENV: prod
  FSP_DEMO_CODES: ${FSP_DEMO_CODES_PROD:-false}

services:
  proxy:
    <<: *limits
    ports: ["80:80", "443:443"]
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }
  web:
    <<: *limits
    deploy: { resources: { limits: { cpus: "0.25", memory: 64M } } }
  migrate:
    environment: *prod-env
  api:
    <<: *limits
    environment:
      <<: *prod-env
      # процессы uvicorn: CPU-задачи (подбор, argon2) не останавливают остальные запросы;
      # лимиты общие для всех процессов (PostgreSQL), так что их число можно менять свободно
      WEB_CONCURRENCY: ${API_WORKERS:-2}
    networks: [edge, internal, egress]
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  worker:
    <<: *limits
    environment: *prod-env
    networks: [internal, egress]
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }
  db:
    <<: *limits
    deploy: { resources: { limits: { cpus: "1.0", memory: 512M } } }
  fsp-mock:
    <<: *limits
    environment:
      FSP_MOCK_EXPOSE_CODES: ${FSP_DEMO_CODES_PROD:-false}
    deploy: { resources: { limits: { cpus: "0.25", memory: 96M } } }
